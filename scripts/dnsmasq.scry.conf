# Template — install-pi.sh substitutes __PI_IP__ and __PI_HOSTNAME__ at install
# time using the Pi's actual values, then writes the result to
# /etc/dnsmasq.d/scry.conf. Edit this file, re-run install-pi.sh (or just
# re-deploy), and the substitution refreshes.

# Don't read /etc/resolv.conf (would loop with our own records).
no-resolv

# Upstream resolvers (used for anything not in our address= list).
server=1.1.1.1
server=9.9.9.9

# Local-only records — A + PTR in one shot via host-record.
# The first name on each line becomes the PTR target. The .lan FQDNs exist
# because Windows' DNS Client refuses to query bare single-label names; bare
# names work via mDNS / NetBIOS / unix tools.
host-record=__PI_HOSTNAME__,__PI_HOSTNAME__.lan,__PI_IP__
host-record=scry,s.cry,scry.lan,__PI_IP__

# Reasonable hygiene.
cache-size=1000
domain-needed
bogus-priv
