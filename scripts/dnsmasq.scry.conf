# Installed by scripts/install-pi.sh to /etc/dnsmasq.d/scry.conf.
#
# Pure DNS for the LAN + WireGuard peers. Replaces Pi-hole's resolver role
# (no admin UI, no blocklists). Listens on all interfaces by default — the Pi
# is behind a router for LAN, and behind WG for remote, so no public exposure.

# Don't read /etc/resolv.conf (would loop with our own records).
no-resolv

# Upstream resolvers (used for anything not in our address= list).
server=1.1.1.1
server=9.9.9.9

# Local-only records — A + PTR in one shot via host-record.
# Each line: comma-separated names, then the IP. The first name becomes the
# PTR target, so reverse lookups of 192.168.0.77 return "wormhole".
# Use the .lan FQDNs from Windows clients (Windows DNS Client refuses bare
# single-label queries); bare names work via mDNS / NetBIOS / unix tools.
host-record=wormhole,worm.hole,192.168.0.77
host-record=scry,s.cry,192.168.0.77

# Reasonable hygiene.
cache-size=1000
domain-needed
bogus-priv
