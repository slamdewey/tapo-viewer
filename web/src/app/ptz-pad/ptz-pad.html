<div class="ptz">
  <div class="pad">
    <button class="up"    (pointerdown)="onPointerDown($event, 'up')"    (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()">▲</button>
    <button class="left"  (pointerdown)="onPointerDown($event, 'left')"  (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()">◀</button>
    <button class="stop"  (click)="pressStop()">■</button>
    <button class="right" (pointerdown)="onPointerDown($event, 'right')" (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()">▶</button>
    <button class="down"  (pointerdown)="onPointerDown($event, 'down')"  (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()">▼</button>
  </div>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }
</div>
